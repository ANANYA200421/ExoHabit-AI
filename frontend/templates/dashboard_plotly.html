<!DOCTYPE html>
<html>
<head>
    <title>Interactive Dashboard</title>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black px-4">
    <span class="navbar-brand">🌌 ExoHabit-AI Dashboard</span>
    <div>
        <a href="/ui" class="btn btn-outline-light btn-sm me-2">Predictor</a>
    </div>
</nav>

<div class="container mt-4">

    <h2>Interactive Analytics</h2>

    <div id="featureImportance" style="height:400px;"></div>
    <div id="distributionPlot" style="height:400px;"></div>
    <div id="correlationHeatmap" style="height:500px;"></div>

</div>

<!-- ================= SAFE DATA LOAD ================= -->

<script id="feature-data" type="application/json">
{{ feature_importance | tojson }}
</script>

<script id="probability-data" type="application/json">
{{ probabilities | tojson }}
</script>

<script id="correlation-data" type="application/json">
{{ correlation_data | tojson }}
</script>

<script id="correlation-columns" type="application/json">
{{ correlation_columns | tojson }}
</script>

<script>

const featureImportance =
    JSON.parse(document.getElementById("feature-data").textContent);

const probabilities =
    JSON.parse(document.getElementById("probability-data").textContent);

const correlationData =
    JSON.parse(document.getElementById("correlation-data").textContent);

const correlationColumns =
    JSON.parse(document.getElementById("correlation-columns").textContent);


// -------- Feature Importance --------
if (Object.keys(featureImportance).length > 0) {

    Plotly.newPlot("featureImportance", [{
        x: Object.values(featureImportance),
        y: Object.keys(featureImportance),
        type: "bar",
        orientation: "h"
    }]);
}


// -------- Distribution --------
Plotly.newPlot("distributionPlot", [{
    x: probabilities,
    type: "histogram"
}]);


// -------- Correlation --------
Plotly.newPlot("correlationHeatmap", [{
    z: correlationData,
    x: correlationColumns,
    y: correlationColumns,
    type: "heatmap"
}]);

</script>

</body>
</html>
