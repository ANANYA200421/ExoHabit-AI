<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ExoHabit-AI Predictor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-dark text-light">

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-dark bg-black px-4">
    <span class="navbar-brand">🌌 ExoHabit-AI</span>

    <div>
        <a href="/ui" class="btn btn-outline-light btn-sm me-2">Predictor</a>
        <a href="/dashboard" class="btn btn-outline-info btn-sm">Dashboard</a>
    </div>
</nav>

<div class="container py-5">

    <h2 class="text-center mb-4">Habitability Prediction System</h2>

    <!-- ================= INPUT FORM ================= -->
    <div class="card bg-secondary p-4 shadow">
        <form id="predictionForm">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Planet Radius</label>
                    <input type="number" step="any" class="form-control" id="pl_rade" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Equilibrium Temperature</label>
                    <input type="number" step="any" class="form-control" id="pl_eqt" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Orbital Period</label>
                    <input type="number" step="any" class="form-control" id="pl_orbper" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Stellar Compatibility</label>
                    <input type="number" step="any" class="form-control" id="stellar_compatibility" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Star Type</label>
                    <select class="form-select" id="st_spectype_simple">
                        <option value="G">G</option>
                        <option value="K">K</option>
                        <option value="M">M</option>
                        <option value="F">F</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Predict Habitability
            </button>

        </form>
    </div>

    <!-- ================= RESULT SECTION ================= -->
    <div class="mt-4 text-center">

        <div id="resultCard"
             class="card bg-dark p-4 mt-3 shadow"
             style="display:none;">

            <h4 id="resultText"></h4>
            <h6 id="probabilityText" class="mt-2"></h6>

            <!-- Progress Bar -->
            <div class="progress mt-3" style="height: 20px;">
                <div id="probBar"
                     class="progress-bar"
                     role="progressbar"
                     style="width: 0%;">
                </div>
            </div>

        </div>

    </div>

    <!-- ================= RANKING BUTTON ================= -->
    <div class="mt-5 text-center">

        <button class="btn btn-outline-info mb-3" onclick="loadRanking()">
            Show Top 5 Ranked Exoplanets
        </button>

        <table class="table table-dark table-striped"
               id="rankingTable"
               style="display:none;">
            <thead>
                <tr>
                    <th>Habitability Probability</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

    </div>

</div>

<!-- ================= JAVASCRIPT ================= -->

<script>

// -------------------- Prediction --------------------
document.getElementById("predictionForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const data = {
        pl_rade: parseFloat(document.getElementById("pl_rade").value),
        pl_eqt: parseFloat(document.getElementById("pl_eqt").value),
        pl_orbper: parseFloat(document.getElementById("pl_orbper").value),
        stellar_compatibility: parseFloat(document.getElementById("stellar_compatibility").value),
        st_spectype_simple: document.getElementById("st_spectype_simple").value
    };

    const response = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    const resultCard = document.getElementById("resultCard");
    const probBar = document.getElementById("probBar");

    if (result.error) {
        document.getElementById("resultText").innerText = "Error: " + result.error;
        document.getElementById("probabilityText").innerText = "";
    } else {

        let probabilityPercent = result.habitability_probability * 100;

        document.getElementById("resultText").innerText =
            "Prediction: " + result.interpretation;

        document.getElementById("probabilityText").innerText =
            "Habitability Probability: " + probabilityPercent.toFixed(2) + "%";

        probBar.style.width = probabilityPercent + "%";
        probBar.innerText = probabilityPercent.toFixed(1) + "%";

        // Dynamic Color
        if (probabilityPercent > 70) {
            probBar.className = "progress-bar bg-success";
        } else if (probabilityPercent > 40) {
            probBar.className = "progress-bar bg-warning";
        } else {
            probBar.className = "progress-bar bg-danger";
        }
    }

    resultCard.style.display = "block";
});


// -------------------- Ranking --------------------
async function loadRanking() {

    const response = await fetch("/rank?top=5");
    const data = await response.json();

    const table = document.getElementById("rankingTable");
    const tbody = table.querySelector("tbody");

    tbody.innerHTML = "";

    data.top_planets.forEach(planet => {
        const row = `<tr>
                        <td>${planet.Habitability_Probability.toFixed(4)}</td>
                    </tr>`;
        tbody.innerHTML += row;
    });

    table.style.display = "table";
}

</script>

</body>
</html>
