<!DOCTYPE html>
<html>
<head>
    <title>ExoHabitAI Dashboard</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-dark text-light">

<div class="container mt-5">

<h2 class="text-center">🌍 ExoHabitAI Dashboard</h2>

<div class="card bg-secondary p-4 mt-4">

<form id="predictForm">
<div class="row">

<div class="col-md-6 mb-3">
<label>Planet Radius</label>
<input type="number" step="any" class="form-control" id="planet_radius" required>
</div>

<div class="col-md-6 mb-3">
<label>Planet Mass</label>
<input type="number" step="any" class="form-control" id="planet_mass" required>
</div>

<div class="col-md-6 mb-3">
<label>Orbital Period</label>
<input type="number" step="any" class="form-control" id="orbital_period" required>
</div>

<div class="col-md-6 mb-3">
<label>Equilibrium Temperature</label>
<input type="number" step="any" class="form-control" id="equilibrium_temperature" required>
</div>

<div class="col-md-6 mb-3">
<label>Star Spectral Type</label>
<select class="form-control" id="st_spectype_simple">
<option value="G">G</option>
<option value="K">K</option>
<option value="M">M</option>
<option value="F">F</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Stellar Compatibility</label>
<input type="number" step="any" class="form-control" id="stellar_compatibility" required>
</div>

</div>

<button type="submit" class="btn btn-warning w-100">Predict</button>
</form>
</div>

<div class="text-center mt-4">
<h4 id="result"></h4>
<p id="score"></p>
</div>

<hr class="mt-5">

<h3 class="text-center">📊 Scientific Insights</h3>

<div class="row mt-4">

<div class="col-md-4">
<img src="{{ url_for('static', filename='feature_importance.png') }}" class="img-fluid">
</div>

<div class="col-md-4">
<img src="{{ url_for('static', filename='score_distribution.png') }}" class="img-fluid">
</div>

<div class="col-md-4">
<img src="{{ url_for('static', filename='correlation_heatmap.png') }}" class="img-fluid">
</div>

</div>

<div class="text-center mt-5">
<a href="/download-report" class="btn btn-success">
Download Top Exoplanets Report
</a>
</div>

</div>

<script>
document.getElementById("predictForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const data = {
        planet_radius: parseFloat(document.getElementById("planet_radius").value),
        planet_mass: parseFloat(document.getElementById("planet_mass").value),
        orbital_period: parseFloat(document.getElementById("orbital_period").value),
        equilibrium_temperature: parseFloat(document.getElementById("equilibrium_temperature").value),
        st_spectype_simple: document.getElementById("st_spectype_simple").value,
        stellar_compatibility: parseFloat(document.getElementById("stellar_compatibility").value)
    };

    fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
        document.getElementById("result").innerHTML =
            result.habitable ? "🟢 Habitable" : "🔴 Not Habitable";
        document.getElementById("score").innerHTML =
            "Habitability Score: " + result.habitability_score;
    });
});
</script>

</body>
</html>
