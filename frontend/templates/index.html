<!DOCTYPE html>
<html>
<head>
<title>ExoHabitAI Prediction</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#020617;
    color:white;
    font-family:Segoe UI;
}

.glass{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(18px);
    border-radius:18px;
    padding:25px;
}

.result-card{
    margin-top:25px;
    text-align:center;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-black border-bottom border-secondary">
<div class="container">
<a class="navbar-brand fw-bold" href="/">🌌 ExoHabitAI</a>
</div>
</nav>

<div class="container py-5">

<h2 class="text-center mb-4">Planet Habitability Prediction</h2>

<div class="glass">

<input id="pl_rade" class="form-control mb-2" placeholder="Planet Radius (Earth Radii)">
<input id="pl_bmasse" class="form-control mb-2" placeholder="Planet Mass (Earth Mass)">
<input id="pl_orbper" class="form-control mb-2" placeholder="Orbital Period (days)">
<input id="pl_eqt" class="form-control mb-3" placeholder="Equilibrium Temperature (K)">

<select id="spectral_type" class="form-control mb-3">
<option value="O">O (Very Hot)</option>
<option value="B">B (Hot)</option>
<option value="A">A (Bright)</option>
<option value="F">F (Warm)</option>
<option value="G">G (Sun-like)</option>
<option value="K">K (Cool)</option>
<option value="M">M (Red dwarf)</option>
</select>

<button class="btn btn-warning w-100" onclick="predict()">Predict</button>

</div>

<div class="result-card">
<h3 id="result"></h3>
<p id="score"></p>
</div>

</div>

<script>

async function predict(){

const payload = {
pl_rade: parseFloat(pl_rade.value),
pl_bmasse: parseFloat(pl_bmasse.value),
pl_orbper: parseFloat(pl_orbper.value),
pl_eqt: parseFloat(pl_eqt.value),
spectral_type: spectral_type.value
};

try{

const res = await fetch("/predict",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(payload)
});

const data = await res.json();

if(!data.success){
alert("Server error: " + data.message);
return;
}

result.innerHTML = data.habitable ? "🟢 Habitable" : "🔴 Not Habitable";
score.innerHTML = "Habitability Score: " + data.habitability_probability;

}catch(err){
alert("Prediction failed. Check backend.");
console.error(err);
}

}
</script>

</body>
</html>
