<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body>

<div id="chart"></div>

<script>
fetch("http://127.0.0.1:5000/feature-importance")
.then(res => res.json())
.then(data => {

    const features = data.map(x => x.feature);
    const values = data.map(x => x.importance);

    Plotly.newPlot('chart', [{
        x: values,
        y: features,
        type: 'bar',
        orientation: 'h'
    }]);
});
</script>

</body>
</html>
