<!DOCTYPE html>
<html>
<body>

<h2>Model Metrics</h2>

<div id="metrics"></div>

<script>
fetch("http://127.0.0.1:5000/model-metrics")
.then(res => res.json())
.then(data => {
    document.getElementById("metrics").innerHTML = `
        Accuracy: ${data.accuracy} <br>
        Precision: ${data.precision} <br>
        Recall: ${data.recall}
    `;
});
</script>

</body>
</html>
