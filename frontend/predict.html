<!DOCTYPE html>
<html>
<head>
    <title>Prediction</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container mt-5">
    <h2>Habitability Prediction</h2>

    <form id="predictForm">

        <input class="form-control mb-2" name="pl_rade" placeholder="Planet Radius" required>
        <input class="form-control mb-2" name="pl_eqt" placeholder="Temperature" required>
        <input class="form-control mb-2" name="pl_orbper" placeholder="Orbital Period" required>
        <input class="form-control mb-2" name="st_teff" placeholder="Star Temperature" required>
        <input class="form-control mb-2" name="stellar_compatibility" placeholder="Compatibility" required>

        <button class="btn btn-primary">Predict</button>
    </form>

    <div id="result" class="mt-4"></div>
</div>

<script src="main.js"></script>

</body>
</html>
