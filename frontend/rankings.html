<!DOCTYPE html>
<html>
<head>
    <title>Rankings</title>
</head>

<body>

<table border="1" id="table">
    <tr>
        <th>Rank</th>
        <th>Planet</th>
        <th>Score</th>
    </tr>
</table>

<script>
fetch("http://127.0.0.1:5000/rankings")
.then(res => res.json())
.then(data => {
    let table = document.getElementById("table");

    data.forEach(p => {
        table.innerHTML += `
        <tr>
            <td>${p.rank}</td>
            <td>${p.planet}</td>
            <td>${p.score}</td>
        </tr>`;
    });
});
</script>

</body>
</html>
